name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    # Branch pushes already run CI; the pull_request trigger is for forks.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
      - name: Shell scripts
        run: shellcheck entrypoint.sh deploy/*.sh

  test-sqlite:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  test-postgres:
    # The same suite on PostgreSQL, plus the tests that create and drop real
    # tenant databases.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: app_main
      DB_SSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -rs

  docker:
    # Builds the image and boots the development stack end to end: migrations,
    # plans, superuser, then a signup that provisions a tenant database.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Health check
        run: curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 http://localhost:8000/health/
      - name: Sign up and reach the tenant dashboard
        run: |
          set -euo pipefail
          jar="$(mktemp)"
          curl -fsS -c "$jar" -o /dev/null http://localhost:8000/register/
          token="$(awk '$6 == "csrftoken" { print $7 }' "$jar")"
          curl -fsS -b "$jar" -c "$jar" -o /dev/null -L \
            -H "Referer: http://localhost:8000/register/" \
            --data-urlencode "csrfmiddlewaretoken=$token" \
            --data-urlencode "organization_name=CI Smoke" \
            --data-urlencode "first_name=Smoke" \
            --data-urlencode "last_name=Test" \
            --data-urlencode "email=smoke@example.com" \
            --data-urlencode "password1=correct-horse-battery" \
            --data-urlencode "password2=correct-horse-battery" \
            http://localhost:8000/register/
          curl -fsS -b "$jar" http://localhost:8000/ | grep -q "Welcome to CI Smoke"
          docker compose exec -T db psql -U app -d app_main -Atc \
            "SELECT datname FROM pg_database WHERE datname LIKE 'tenant_%'" | grep -q '^tenant_ci_smoke_'
      - name: Logs
        if: always()
        run: docker compose logs --no-color --tail 100
