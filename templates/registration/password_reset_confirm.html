{% extends "base.html" %}
{% block content %}
<div class="narrow">
  <h1 class="h3 mb-4">Choose a new password</h1>
  {% if validlink is False %}
  <p>This reset link is invalid or has already been used. <a href="{% url 'password_reset' %}">Request a new one.</a></p>
  {% else %}
  <form method="post">
    {% csrf_token %}
    {% include "_form.html" %}
    <button class="btn btn-primary w-100">Save password</button>
  </form>
  {% endif %}
</div>
{% endblock %}
